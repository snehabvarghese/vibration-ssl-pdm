[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# `typing.Dict`/`List` annotations are kept throughout for readability, so the
# pyupgrade (UP) rules are not enabled.
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]   # long lines are usually explanatory comments

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
